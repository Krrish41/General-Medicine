 bounding pulses |\n| **Obstructive** | **Low** | **High** | **High** | Low (< 60%) | Cold, clammy; distended JVP, pulsus paradoxus |\n| **Neurogenic** | **Low or Normal** | **Low** | **Very Low** | Variable | Warm and dry below spinal cord lesion; **Bradycardia** |\n\n* **Pathophysiological Cascade of Cellular Shock**:\n  Hypoperfusion \u2500\u2500\u25ba Cellular Hypoxia \u2500\u2500\u25ba Halts Mitochondrial Oxidative Phosphorylation \u2500\u2500\u25ba Switch to Anaerobic Glycolysis \u2500\u2500\u25ba Massive **Lactate accumulation** + ATP depletion \u2500\u2500\u25ba Failure of $Na^+/K^+$ ATPase pumps \u2500\u2500\u25ba Cellular edema, lysosomal rupture, and cell necrosis."}, {"title": "2. Clinical Stages of Shock", "content": "1. **Compensated (Non-Progressive) Stage**:\n   * Compensatory baroreceptor and sympathetic reflex mechanisms maintain blood pressure: Tachycardia, peripheral arteriolar vasoconstriction (cold extremities), tachypnea, oliguria (RAAS salt/water conservation).\n   * **Blood pressure is NORMAL** (Systolic BP maintained; narrow pulse pressure).\n2. **Decompensated (Progressive) Stage**:\n   * Compensatory mechanisms fail. Tissue hypoperfusion becomes widespread.\n   * **Hypotension (Systolic BP < 90 mmHg or MAP < 65 mmHg)**, marked tachycardia (HR > 120 bpm), rapid thready pulse, profound oliguria (< 0.5 mL/kg/hr), metabolic acidosis with Kussmaul breathing, restlessness, and obtundation.\n3. **Irreversible (Refractory) Stage**:\n   * Widespread microvascular thrombosis, complete loss of vasomotor tone, acute tubular necrosis, myocardial depression, ARDS, DIC, and Multi-Organ Dysfunction Syndrome (MODS). Death is imminent despite restoration of hemodynamics."}, {"title": "3. Management of Specific Shock Syndromes", "content": "### A. Anaphylactic Shock Protocol (Immediate Dental Chair Emergency!)\n* Sudden Type I IgE hypersensitivity (penicillins, latex, local anesthetics, chlorhexidine).\n* Presents with acute bronchospasm, laryngeal stridor, generalized urticaria, facial angioedema, and sudden profound hypotension.\n1. **Immediate Epinephrine (First-Line Life Saver!)**:\n   * **Adrenaline (Epinephrine) 1:1,000 (1 mg/mL)**: **0.5 mg (0.5 mL) INTRAMUSCULARLY into the anterolateral mid-thigh**.\n   * Repeat every 5 to 15 minutes if symptoms persist.\n2. **Positioning & Airway**: Lay patient flat with legs elevated (Trendelenburg position); administer 100% High-Flow Oxygen (10\u201315 L/min).\n3. **Parenteral Adjuncts (Second-Line, After Adrenaline)**:\n   * **IV Hydrocortisone**: 200 mg IV (prevents biphasic relapse).\n   * **IV Chlorpheniramine** (or Diphenhydramine): 10\u201320 mg slow IV.\n4. **Aggressive IV Fluid Bolus**: 1 to 2 Liters of Normal Saline rapid infusion.\n\n### B. Septic Shock Protocol (Surviving Sepsis Campaign 1-Hour Bundle)\n1. Measure Blood Lactate level (re-measure if initial lactate > 2 mmol/L).\n2. Obtain blood cultures prior to starting antibiotics.\n3. Administer broad-spectrum IV antimicrobials (e.g., Piperacillin-Tazobactam + Vancomycin).\n4. Rapid administration of **30 mL/kg Crystalloid IV** for hypotension or lactate \u2265 4 mmol/L.\n5. Apply Vasopressors: **Noradrenaline (Norepinephrine)** is the first-line vasopressor to maintain **MAP \u2265 65 mmHg**."}, {"title": "4. Cardiopulmonary Resuscitation (BLS & ACLS Guidelines)", "content": "The AHA / Resuscitation Council guidelines emphasize the **'C-A-B' (Compressions - Airway - Breathing)** sequence:\n\n```\n                            UNRESPONSIVE VICTIM\n                                     \u2502\n                 Shout for nearby help & activate EMS / Code Blue\n                         Check Carotid Pulse (< 10 seconds)\n                                     \u2502\n        \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n        \u25bc                                                         \u25bc\nPULSE PRESENT                                             PULSE ABSENT / UNCERTAIN\nProvide rescue breathing (1 breath every 6 sec)           START HIGH-QUALITY CPR IMMEDIATELY\nRe-check pulse every 2 minutes                            (30 Compressions : 2 Breaths)\n                                                                  \u2502\n                                                          ATTACH AED / DEFIBRILLATOR\n                                                                  \u2502\n                                      \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n                                      \u25bc                                                       \u25bc\n                               SHOCKABLE RHYTHM                                       NON-SHOCKABLE RHYTHM\n                      (Ventricular Fibrillation / Pulseless VT)                     (Asystole / PEA)\n                                      \u2502                                                       \u2502\n                              DELIVER 1 SHOCK                                         CONTINUE CPR (30:2)\n                              (150-200 J Biphasic)                                    IV ADRENALINE (1 mg IV)\n                              RESUME CPR IMMEDIATELY                                  as soon as possible\n                              for 2 minutes                                           Repeat every 3-5 min\n                                      \u2502\n                      IV ADRENALINE 1 mg after 2nd shock\n                      IV AMIODARONE 300 mg after 3rd shock\n```\n\n### High-Quality CPR Performance Metrics\n* **Compression Rate**: **100 to 120 compressions per minute**.\n* **Compression Depth**: At least **5 cm (2 inches)**, but not exceeding 6 cm (2.4 inches) in adults.\n* **Chest Recoil**: Allow **complete, full chest recoil** after each compression; do not lean on the chest!\n* **Minimize Interruptions**: Keep interruptions in chest compressions to < 10 seconds.\n* **Avoid Excessive Ventilation**: Deliver 2 breaths after every 30 compressions; each breath given over 1 second, just enough to produce visible chest rise."}, {"title": "5. Chairside Medical Emergencies in Dental Practice", "content": "1. **Vasovagal Syncope (Most Common Dental Chair Emergency)**:\n   * Transient cerebral hypoperfusion triggered by emotional fear, anxiety, or pain.\n   * Signs: Pallor, cold clammy diaphoresis, yawning, nausea, bradycardia, hypotension.\n   * **Management**: Immediately discontinue treatment; place patient in flat supine position with **legs elevated 45 degrees (Trendelenburg position)**; loosen tight clothing; administer oxygen. Full recovery occurs within 1\u20132 minutes.\n2. **Local Anesthetic Systemic Toxicity (LAST)**:\n   * Accidental intravascular injection of lidocaine/bupivacaine.\n   * Early: Metallic taste, perioral numbness, tinnitus, agitation, slurred speech.\n   * Severe: Tonic-clonic seizures, cardiovascular collapse, ventricular arrhythmias.\n   * **Antidote**: **20% Intravenous Lipid Emulsion (Intralipid)** (1.5 mL/kg IV bolus)."}], "comparisons": [{"title": "Hypovolemic vs Cardiogenic vs Septic Shock", "headers": ["Clinical Parameter", "Hypovolemic Shock", "Cardiogenic Shock", "Septic Shock"], "rows": [["Primary Defect", "Intravascular volume loss", "Myocardial pump failure", "Peripheral systemic vasodilation"], ["Cardiac Output", "**Low**", "**Severely Low**", "**High (Early) / Normal**"], ["Systemic Vascular Resistance", "**High** (Vasoconstriction)", "**High** (Vasoconstriction)", "**Profoundly Low** (Vasodilation)"], ["Jugular Venous Pressure", "**Flat / Collapsed**", "**Distended / High**", "Normal or Low"], ["Extremities / Skin", "Cold, clammy, pale", "Cold, clammy, cyanotic", "**Warm, flushed, dry (Hyperdynamic)**"], ["Primary First-Line Treatment", "IV Crystalloid Fluids / Blood", "Inotropes (Dobutamine) / Revascularization", "IV Fluids + Noradrenaline + Antibiotics"]]}], "must_draw": "Algorithmic flowchart of the Basic Life Support (BLS) adult cardiac arrest protocol detailing the 30:2 compression-to-ventilation cycle and the decision node for Shockable vs Non-Shockable rhythms.", "viva_questions": ["Why is Intramuscular Adrenaline preferred over Subcutaneous injection in Anaphylaxis? (Answer: The extensive vascularity of the anterolateral thigh muscle produces rapid, reliable peak therapeutic plasma levels within 8 minutes, compared to delayed, unpredictable absorption (>30 min) subcutaneously).", "What is the first-line vasopressor in Septic Shock? (Answer: Noradrenaline (Norepinephrine) administered to achieve a target Mean Arterial Pressure (MAP) \u2265 65 mmHg).", "What are the two shockable rhythms in cardiac arrest? (Answer: Ventricular Fibrillation (VF) and Pulseless Ventricular Tachycardia (pVT)).", "What is the compression-to-ventilation ratio for adult CPR? (Answer: 30 chest compressions to 2 rescue breaths).", "What is the immediate chairside management of vasovagal syncope in a dental patient? (Answer: Place patient in flat supine position with legs elevated 45 degrees (Trendelenburg), loosen tight collar, maintain patent airway, and administer high-flow oxygen)."]}];
        let currentCategory = 'All';
        let activeChapterId = CHAPTERS[0].id;

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.filter-chip').forEach(btn => {
                if (btn.innerText.toLowerCase().includes(cat.toLowerCase()) || (cat === 'All' && btn.innerText.includes('All'))) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            renderTopicList();
        }

        function filterTopics() {
            renderTopicList();
        }

        function renderTopicList() {
            const query = document.getElementById('topicSearch').value.toLowerCase();
            const listEl = document.getElementById('topicListContainer');
            listEl.innerHTML = '';

            const filtered = CHAPTERS.filter(ch => {
                const matchesCat = (currentCategory === 'All') || ch.category.toLowerCase().includes(currentCategory.toLowerCase());
                const matchesQuery = !query || ch.title.toLowerCase().includes(query) || ch.sections.some(s => s.content.toLowerCase().includes(query));
                return matchesCat && matchesQuery;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = '<div style="padding:20px; color:#64748b; text-align:center;">No matching topics found.</div>';
                return;
            }

            filtered.forEach(ch => {
                const item = document.createElement('div');
                item.className = 'topic-item' + (ch.id === activeChapterId ? ' active' : '');
                item.onclick = () => selectChapter(ch.id);
                item.innerHTML = `
                    <div class="topic-item-title">${ch.title}</div>
                    <div class="topic-item-meta">
                        <span>${ch.category}</span>
                        <span>${ch.reading_time}</span>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function selectChapter(id) {
            activeChapterId = id;
            renderTopicList();
            renderViewer();
        }

        function renderViewer() {
            const ch = CHAPTERS.find(c => c.id === activeChapterId) || CHAPTERS[0];
            const viewerEl = document.getElementById('viewerContainer');

            let sectionsHtml = '';
            ch.sections.forEach(sec => {
                sectionsHtml += `
                    <div class="viewer-section">
                        <h3 class="viewer-section-title">${sec.title}</h3>
                        <div class="viewer-body">${markdownToHtml(sec.content)}</div>
                    </div>
                `;
            });

            let comparisonsHtml = '';
            if (ch.comparisons && ch.comparisons.length > 0) {
                ch.comparisons.forEach(comp => {
                    let tableRows = '';
                    comp.rows.forEach(r => {
                        tableRows += '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>';
                    });
                    comparisonsHtml += `
                        <div class="viewer-section">
                            <h3 class="viewer-section-title">${comp.title}</h3>
                            <div class="viewer-body">
                                <table>
                                    <thead><tr>${comp.headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
                                    <tbody>${tableRows}</tbody>
                                </table>
                            </div>
                        </div>
                    `;
                });
            }

            let vivaHtml = '';
            if (ch.viva_questions && ch.viva_questions.length > 0) {
                vivaHtml = `
                    <div class="viva-box">
                        <div class="viva-title">High-Yield Clinical & Viva Voce Pearls</div>
                        <ul class="viva-list">
                            ${ch.viva_questions.map(q => `<li>${q}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            viewerEl.innerHTML = `
                <div class="viewer-header">
                    <div class="viewer-category">${ch.category} • ${ch.badge}</div>
                    <h2 class="viewer-title">${ch.title}</h2>
                    <div class="clinical-pearl-card">
                        <strong>Clinical Pearl:</strong> ${ch.clinical_pearl}
                    </div>
                </div>
                ${sectionsHtml}
                ${comparisonsHtml}
                ${vivaHtml}
            `;
            viewerEl.scrollTop = 0;
        }

        function markdownToHtml(md) {
            if (!md) return '';
            let html = md
                .replace(/^### (.*$)/gim, '<h4 style="font-size:1.05rem; font-weight:700; margin:1rem 0 0.5rem 0; color:#e2e8f0;">$1</h4>')
                .replace(/^## (.*$)/gim, '<h3 style="font-size:1.15rem; font-weight:700; margin:1.2rem 0 0.6rem 0; color:#fff;">$1</h3>')
                .replace(/^# (.*$)/gim, '<h2 style="font-size:1.3rem; font-weight:800; margin:1.5rem 0 0.8rem 0; color:#fff;">$1</h2>')
                .replace(/\*\*(.*?)\*\*/gim, '<strong style="color:#f8fafc;">$1</strong>')
                .replace(/\*(.*?)\*/gim, '<em>$1</em>')
                .replace(/```([\s\S]*?)```/gim, '<pre>$1</pre>')
                .replace(/^\* (.*$)/gim, '<li>$1</li>')
                .replace(/\n/gim, '<br>');
            return html;
        }

        // Initial render
        renderTopicList();
        renderViewer();
    </script>
